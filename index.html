<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <!-- Tailwind CSS untuk Tampilan Modern & Responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Feather Icons untuk Ikon Visual -->
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    /* Efek cermin khusus untuk kamera depan agar tampilan intuitif */
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
    
    <!-- Header Web -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
      <div class="w-14 h-14 mx-auto items-center justify-center">
          <img src="https://lh3.googleusercontent.com/d/1erlU3Wwr8NuIusv6FXvG3qahEv7D1eQL">
        </div>
      <h1 class="text-2xl font-bold">Buku Tamu Digital</h1>
      <p class="text-blue-100 text-sm mt-1">Silakan isi formulir di bawah ini untuk pencatatan kunjungan</p>
    </div>

    <!-- Form Utama -->
    <form id="guestForm" class="p-6 space-y-5">
      
      <!-- Input Nama -->
      <div>
        <label for="nama" class="block text-sm font-semibold text-slate-700 mb-1">Nama Pengunjung <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-feather="user" class="w-5 h-5"></i>
          </div>
          <input type="text" id="nama" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm" placeholder="Masukkan nama lengkap Anda" required>
        </div>
      </div>

      <!-- Input Asal -->
      <div>
        <label for="asal" class="block text-sm font-semibold text-slate-700 mb-1">Asal Instansi / Pekerjaan <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-feather="briefcase" class="w-5 h-5"></i>
          </div>
          <input type="text" id="asal" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm" placeholder="Contoh: Bimbel X, Guru SMA Y, Kontraktor PT, dst" required>
        </div>
      </div>

      <!-- Input Telepon -->
      <div>
        <label for="telepon" class="block text-sm font-semibold text-slate-700 mb-1">Nomor Telepon (WhatsApp) <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-feather="phone" class="w-5 h-5"></i>
          </div>
          <input type="tel" id="telepon" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm" placeholder="08xxxxxxxxxx" required>
        </div>
      </div>

      <!-- Dropdown Unit Tujuan -->
      <div>
        <label for="tujuan" class="block text-sm font-semibold text-slate-700 mb-1">Pihak / Unit Tujuan <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-feather="building" class="w-5 h-5"></i>
          </div>
          <select id="tujuan" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm bg-white" required>
            <option value="">-- Pilih Unit Tujuan --</option>
            <option value="TU">Tata Usaha (TU)</option>
            <option value="Kurikulum">Kurikulum</option>
            <option value="Kesiswaan">Kesiswaan</option>
            <option value="Humas">Humas</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>

      <!-- Dropdown Keperluan -->
      <div>
        <label for="keperluanSelect" class="block text-sm font-semibold text-slate-700 mb-1">Keperluan <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-feather="file-text" class="w-5 h-5"></i>
          </div>
          <select id="keperluanSelect" onchange="toggleKeperluanLainnya()" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm bg-white" required>
            <option value="">-- Pilih Keperluan --</option>
            <option value="Mengajar Bimbel">Mengajar Bimbel</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <!-- Input tambahan dinamis untuk Keperluan Lainnya -->
        <textarea id="other-keperluan" class="hidden w-full mt-2 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-slate-800 text-sm" rows="3" placeholder="Tuliskan rincian keperluan Anda..."></textarea>
      </div>

      <!-- Area Kamera Live -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Foto Swafoto (Live) <span class="text-red-500">*</span></label>
        <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-video border-2 border-slate-200 flex items-center justify-center">
          <!-- Stream Kamera -->
          <video id="video" autoplay playsinline class="w-full h-full object-cover mirror"></video>
          <!-- Hasil Tangkapan Canvas -->
          <canvas id="canvas" class="hidden w-full h-full object-cover"></canvas>
          
          <!-- Indikator Belum Ada Foto -->
          <div id="cameraStatus" class="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-sm flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Kamera Aktif
          </div>
        </div>

        <!-- Tombol Kontrol Kamera -->
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button type="button" id="btnCapture" onclick="takeSnapshot()" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white py-2 px-3 rounded-lg text-sm font-medium transition">
            <i data-feather="camera" class="w-4 h-4"></i> Ambil Foto
          </button>
          <button type="button" id="btnSwitch" onclick="switchCamera()" class="flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-3 rounded-lg text-sm font-medium transition border border-slate-300">
            <i data-feather="refresh-cw" class="w-4 h-4"></i> Ganti Kamera
          </button>
          <button type="button" id="btnRetake" onclick="resetCamera()" class="hidden col-span-2 flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-white py-2 px-3 rounded-lg text-sm font-medium transition">
            <i data-feather="rotate-ccw" class="w-4 h-4"></i> Foto Ulang
          </button>
        </div>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center gap-2">
        <i data-feather="send" class="w-5 h-5"></i> Kirim Data Kunjungan
      </button>

    </form>
  </div>

  <script>
    // Inisialisasi Ikon Feather
    feather.replace();

    // =========================================================================
    // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwy7PiCBsJHyP4b7tIJjPoHbJMfcl7KwdTrATLmSgBvx8CqevpSg05QkkHeFiu6q67e/exec";
    // =========================================================================

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnSwitch = document.getElementById('btnSwitch');
    const btnCapture = document.getElementById('btnCapture');
    const btnRetake = document.getElementById('btnRetake');
    const cameraStatus = document.getElementById('cameraStatus');
    
    let photoData = null;
    let currentStream = null;
    let useFacingMode = "user"; // Default: Kamera Depan

    // Aktifkan Stream Kamera
    function startCamera(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      // Atur kelas cermin (mirror) hanya untuk kamera depan
      if (facingMode === "user") {
        video.classList.add('mirror');
        canvas.classList.add('mirror');
      } else {
        video.classList.remove('mirror');
        canvas.classList.remove('mirror');
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
        .then(stream => {
          currentStream = stream;
          video.srcObject = stream;
        })
        .catch(err => {
          console.error("Akses kamera ditolak/gagal:", err);
          alert("Gagal mengakses kamera. Izinkan akses kamera pada browser Anda.");
        });
    }

    // Jalankan kamera saat halaman dimuat
    startCamera(useFacingMode);

    // Fungsi Ganti Kamera (Depan <-> Belakang)
    function switchCamera() {
      useFacingMode = (useFacingMode === "user") ? "environment" : "user";
      startCamera(useFacingMode);
    }

    // Toggle Input Textarea 'Lainnya'
    function toggleKeperluanLainnya() {
      const select = document.getElementById('keperluanSelect');
      const otherText = document.getElementById('other-keperluan');
      if (select.value === 'Lainnya') {
        otherText.classList.remove('hidden');
        otherText.required = true;
      } else {
        otherText.classList.add('hidden');
        otherText.required = false;
        otherText.value = '';
      }
    }

    // Ambil Foto & Kompresi Otomatis
    function takeSnapshot() {
      const context = canvas.getContext('2d');
      const maxWidth = 800;
      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      // Efek pembalikan cermin pada canvas jika menggunakan kamera depan
      if (useFacingMode === "user") {
        context.translate(width, 0);
        context.scale(-1, 1);
      }
      
      context.drawImage(video, 0, 0, width, height);
      
      // Kompresi kualitas gambar JPEG ke 70% (0.7)
      photoData = canvas.toDataURL('image/jpeg', 0.7);
      
      video.classList.add('hidden');
      canvas.classList.remove('hidden');
      
      btnCapture.classList.add('hidden');
      btnSwitch.classList.add('hidden');
      btnRetake.classList.remove('hidden');

      cameraStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Foto Terkunci`;
    }

    // Reset Kamera
    function resetCamera() {
      photoData = null;
      video.classList.remove('hidden');
      canvas.classList.add('hidden');
      
      btnCapture.classList.remove('hidden');
      btnSwitch.classList.remove('hidden');
      btnRetake.classList.add('hidden');

      cameraStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Kamera Aktif`;
    }

    // Pengiriman Form via Fetch API
    document.getElementById('guestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!photoData) {
        alert("Silakan jepret foto swafoto terlebih dahulu!");
        return;
      }

      const keperluanSelect = document.getElementById('keperluanSelect').value;
      const keperluanFinal = (keperluanSelect === 'Lainnya') 
        ? document.getElementById('other-keperluan').value 
        : keperluanSelect;

      const payload = {
        nama: document.getElementById('nama').value,
        asal: document.getElementById('asal').value,
        telepon: document.getElementById('telepon').value,
        tujuan: document.getElementById('tujuan').value,
        keperluan: keperluanFinal,
        foto: photoData
      };

      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.innerHTML = `<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Menyimpan Data...`;
      feather.replace();
      submitBtn.disabled = true;

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.result === 'success') {
          alert("✅ Data kunjungan berhasil dicatat!");
          location.reload();
        } else {
          alert("❌ Terjadi kesalahan: " + response.message);
          submitBtn.innerHTML = `<i data-feather="send" class="w-5 h-5"></i> Kirim Data Kunjungan`;
          feather.replace();
          submitBtn.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        alert("❌ Gagal terhubung ke server.");
        submitBtn.innerHTML = `<i data-feather="send" class="w-5 h-5"></i> Kirim Data Kunjungan`;
        feather.replace();
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
