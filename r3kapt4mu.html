<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Kunjungan - SMAN Taruna Nala Jatim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse untuk Membaca CSV Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- FontAwesome Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <img src="https://lh3.googleusercontent.com/d/1erlU3Wwr8NuIusv6FXvG3qahEv7D1eQL" alt="Logo" class="w-full h-full object-contain">
                <div>
                    <h1 class="text-xl font-bold leading-tight">SMA Negeri Taruna Nala Jawa Timur</h1>
                    <div class="flex items-center space-x-2">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        <p class="text-xs text-blue-200">Real-Time Sync Active</p>
                    </div>
                </div>
            </div>
            
            <!-- Menu Filter Tanggal -->
            <div class="bg-blue-800 p-2 rounded-lg flex items-center space-x-3 shadow-inner">
                <label for="filterTanggal" class="text-sm font-medium text-blue-100 flex items-center">
                    <i class="fa-regular fa-calendar-days mr-2"></i> Pilih Tanggal:
                </label>
                <input type="date" id="filterTanggal" onchange="filterData()" 
                    class="bg-white text-gray-800 text-sm font-semibold px-3 py-1.5 rounded border focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container mx-auto px-6 py-8">

        <!-- Info Grafis Ringkasan -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Total Pengunjung Card -->
            <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-blue-600 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-semibold uppercase tracking-wider">Total Pengunjung Hari Ini</p>
                    <h2 id="totalPengunjungText" class="text-4xl font-extrabold text-gray-800 mt-1">0</h2>
                    <p id="labelTanggalSelected" class="text-xs text-blue-600 mt-1 font-medium">Tanggal: -</p>
                </div>
                <div class="bg-blue-100 text-blue-600 p-4 rounded-full">
                    <i class="fa-solid fa-users text-2xl"></i>
                </div>
            </div>

            <!-- Grafik Ringkasan -->
            <div class="bg-white rounded-xl shadow-md p-6 md:col-span-2">
                <h3 class="text-md font-bold text-gray-700 mb-2 flex items-center">
                    <i class="fa-solid fa-chart-line text-blue-600 mr-2"></i> Grafik Kunjungan
                </h3>
                <div class="h-40">
                    <canvas id="visitorChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabel Rekapitulasi -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fa-solid fa-list-check text-blue-600 mr-2"></i> Rekapitulasi Data Tamu
                </h3>
                <span id="badgeCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 Data</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-900 text-white text-xs uppercase tracking-wider">
                            <th class="py-3 px-4 w-32">Foto Tamu</th>
                            <th class="py-3 px-4">Nama Pengunjung</th>
                            <th class="py-3 px-4">Asal Instansi/Pekerjaan</th>
                            <th class="py-3 px-4">Nomor Telepon</th>
                            <th class="py-3 px-4">Tujuan / Unit</th>
                            <th class="py-3 px-4">Keperluan</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPengunjung" class="divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">Memuat data dari Google Sheets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Pop-up Foto Besar -->
    <div id="photoModal" class="fixed inset-0 bg-black bg-opacity-75 hidden flex items-center justify-center z-50 p-4" onclick="closeModal()">
        <div class="relative max-w-2xl max-h-[90vh] bg-white rounded-lg p-2 overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-2 right-2 text-white bg-red-600 hover:bg-red-700 rounded-full w-8 h-8 flex items-center justify-center text-bold shadow">✕</button>
            <img id="modalImage" src="" alt="Foto Tamu Besar" class="max-h-[80vh] w-auto mx-auto rounded object-contain">
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRV5RobnV2WuTWj-Ox_BmzcBmz5XxlUs72gSCsp7XsiPX2soWVDgJCh7gg8tBmXAiWfiBSeACfRMl8N/pub?gid=0&single=true&output=csv";

        let allData = [];
        let myChart = null;

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('filterTanggal').value = today;

            // Load data pertama kali
            fetchDataFromSheet();

            // SINKRONISASI REAL-TIME: Ambil data baru secara otomatis setiap 15 detik
            setInterval(() => {
                fetchDataFromSheet(true);
            }, 15000); 
        });

        function fetchDataFromSheet(isSilent = false) {
            // Menambahkan timestamp URL parameter agar terhindar dari kuki browser/cache lama
            const cacheBusterUrl = csvUrl + "&t=" + new Date().getTime();

            Papa.parse(cacheBusterUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data.map(item => {
                        let formattedDate = "";
                        if (item.Timestamp) {
                            const datePart = item.Timestamp.split(" ")[0];
                            const parts = datePart.split("/");
                            if (parts.length === 3) {
                                const month = parts[0].padStart(2, '0');
                                const day = parts[1].padStart(2, '0');
                                const year = parts[2];
                                formattedDate = `${year}-${month}-${day}`;
                            }
                        }

                        let photoUrl = item["Link Foto Drive"] || item["Foto (Tamu)"] || "";
                        if (photoUrl.includes("drive.google.com")) {
                            const match = photoUrl.match(/\/d\/([^\/]+)/);
                            if (match && match[1]) {
                                photoUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
                            }
                        }

                        return {
                            timestamp: item.Timestamp || "",
                            tanggal: formattedDate,
                            nama: item["Nama Pengunjung"] || "-",
                            instansi: item["Asal Instansi/Pekerjaan"] || "-",
                            telepon: item["Nomor Telepon"] || "-",
                            tujuan: item["Tujuan / Unit"] || "-",
                            keperluan: item.Keperluan || "-",
                            foto: photoUrl
                        };
                    });

                    renderChart();
                    filterData();
                }
            });
        }

        function filterData() {
            const selectedDate = document.getElementById('filterTanggal').value;
            const tabelBody = document.getElementById('tabelPengunjung');
            const totalText = document.getElementById('totalPengunjungText');
            const labelTanggal = document.getElementById('labelTanggalSelected');
            const badgeCount = document.getElementById('badgeCount');

            const dateObj = new Date(selectedDate);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDateStr = isNaN(dateObj) ? selectedDate : dateObj.toLocaleDateString('id-ID', options);
            labelTanggal.innerText = `Tanggal: ${formattedDateStr}`;

            const filteredData = allData.filter(item => item.tanggal === selectedDate);

            totalText.innerText = filteredData.length;
            badgeCount.innerText = `${filteredData.length} Data Ditemukan`;

            tabelBody.innerHTML = "";

            if (filteredData.length === 0) {
                tabelBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-gray-500">
                            <i class="fa-solid fa-folder-open text-3xl mb-2 text-gray-300"></i><br>
                            Tidak ada data pengunjung pada tanggal ini.
                        </td>
                    </tr>
                `;
                return;
            }

            filteredData.forEach(item => {
                // FOTO LEBIH BESAR: Ukuran ditingkatkan menjadi 80x80px (w-20 h-20) + Fitur Klik Pop-Up
                const imgTag = item.foto 
                    ? `<img src="${item.foto}" alt="${item.nama}" 
                        class="w-20 h-20 rounded-lg object-cover border-2 border-blue-500 cursor-pointer shadow hover:scale-105 transition transform"
                        onclick="openModal('${item.foto}')"
                        onerror="this.src='https://via.placeholder.com/150?text=No+Photo'">`
                    : `<div class="w-20 h-20 rounded-lg bg-gray-200 flex items-center justify-center text-gray-400 text-xs text-center p-1">Tanpa Foto</div>`;

                const row = `
                    <tr class="hover:bg-blue-50 transition">
                        <td class="py-3 px-4">${imgTag}</td>
                        <td class="py-3 px-4 font-semibold text-gray-800">${item.nama}</td>
                        <td class="py-3 px-4">${item.instansi}</td>
                        <td class="py-3 px-4 text-gray-600">${item.telepon}</td>
                        <td class="py-3 px-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded">
                                ${item.tujuan}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-gray-700">${item.keperluan}</td>
                    </tr>
                `;
                tabelBody.innerHTML += row;
            });
        }

        function renderChart() {
            const ctx = document.getElementById('visitorChart').getContext('2d');
            
            const dateCounts = {};
            allData.forEach(item => {
                if (item.tanggal) {
                    dateCounts[item.tanggal] = (dateCounts[item.tanggal] || 0) + 1;
                }
            });

            const labels = Object.keys(dateCounts).sort();
            const dataCounts = labels.map(date => dateCounts[date]);

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Jumlah Pengunjung',
                        data: dataCounts,
                        backgroundColor: 'rgba(30, 58, 138, 0.7)',
                        borderColor: 'rgba(30, 58, 138, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // FUNGSI UNTUK MODAL ZOOM FOTO
        function openModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.add('hidden');
        }
    </script>
</body>
</html>
