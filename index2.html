<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    /* Custom Styling & Mirror Camera */
    .mirror {
      transform: scaleX(-1);
    }
    
    .input-focus-effect:focus-within {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    /* Animation Keyframes */
    @keyframes modalPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-modal {
      animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 lg:p-10 font-sans relative overflow-x-hidden">

  <!-- Background Decorative Blurs -->
  <div class="fixed -top-40 -left-40 w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Container: Max Width Dinamis sampai 4XL untuk Desktop -->
  <div class="w-full max-w-md lg:max-w-4xl bg-slate-900/90 backdrop-blur-2xl rounded-3xl shadow-2xl overflow-hidden border border-slate-800 my-auto z-10">
    
    <!-- Header Web -->
    <div class="relative bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 p-6 sm:p-8 text-white text-center overflow-hidden">
      <div class="absolute inset-0 bg-black/10"></div>
      <div class="relative z-10 flex flex-col items-center">
        <div class="w-16 h-16 bg-white/10 backdrop-blur-md p-2.5 rounded-2xl border border-white/20 shadow-inner mb-3 transform hover:scale-105 transition-transform duration-300">
          <img src="https://lh3.googleusercontent.com/d/1erlU3Wwr8NuIusv6FXvG3qahEv7D1eQL" alt="Logo" class="w-full h-full object-contain filter drop-shadow">
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Buku Tamu Digital</h1>
        <p class="text-blue-100/90 text-xs sm:text-sm mt-1.5 max-w-md">Silakan lengkapi informasi di bawah ini untuk pencatatan kunjungan Anda.</p>
      </div>
    </div>

    <!-- Form Utama: Responsive Grid Layout (1 Kolom Mobile, 2 Kolom Desktop) -->
    <form id="guestForm" class="p-5 sm:p-8 space-y-6">
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        
        <!-- KOLOM KIRI: Informasi Pengunjung -->
        <div class="space-y-5">
          <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider border-b border-slate-800 pb-2 flex items-center gap-2">
            <i data-feather="user-check" class="w-4 h-4"></i> Data Diri & Tujuan
          </h2>

          <!-- Input Nama -->
          <div class="space-y-1.5">
            <label for="nama" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
              Nama Pengunjung <span class="text-rose-400">*</span>
            </label>
            <div class="relative flex items-center input-focus-effect rounded-xl">
              <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                <i data-feather="user" class="w-5 h-5"></i>
              </div>
              <input type="text" id="nama" class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all" placeholder="Masukkan nama lengkap Anda" required>
            </div>
          </div>

          <!-- Input Asal -->
          <div class="space-y-1.5">
            <label for="asal" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
              Asal Instansi / Pekerjaan <span class="text-rose-400">*</span>
            </label>
            <div class="relative flex items-center input-focus-effect rounded-xl">
              <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                <i data-feather="briefcase" class="w-5 h-5"></i>
              </div>
              <input type="text" id="asal" class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all" placeholder="Contoh: Bimbel X, Guru SMA Y, PT Z" required>
            </div>
          </div>

          <!-- Input Telepon -->
          <div class="space-y-1.5">
            <label for="telepon" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
              Nomor Telepon (WhatsApp) <span class="text-rose-400">*</span>
            </label>
            <div class="relative flex items-center input-focus-effect rounded-xl">
              <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                <i data-feather="phone" class="w-5 h-5"></i>
              </div>
              <input type="tel" id="telepon" class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all" placeholder="08xxxxxxxxxx" required>
            </div>
          </div>

          <!-- Dropdown Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Dropdown Unit Tujuan -->
            <div class="space-y-1.5">
              <label for="tujuan" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                Unit Tujuan <span class="text-rose-400">*</span>
              </label>
              <div class="relative flex items-center input-focus-effect rounded-xl">
                <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                  <i data-feather="building" class="w-5 h-5"></i>
                </div>
                <select id="tujuan" class="w-full pl-11 pr-8 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer" required>
                  <option value="" disabled selected class="bg-slate-900 text-slate-400">Pilih Unit</option>
                  <option value="KS" class="bg-slate-900">Kepala Sekolah</option>
                  <option value="TU" class="bg-slate-900">Tata Usaha (TU)</option>
                  <option value="Kurikulum" class="bg-slate-900">Kurikulum</option>
                  <option value="Kesiswaan" class="bg-slate-900">Kesiswaan</option>
                  <option value="Humas" class="bg-slate-900">Humas</option>
                  <option value="Sarpras" class="bg-slate-900">Sarpras</option>
                  <option value="Lainnya" class="bg-slate-900">Lainnya</option>
                </select>
                <div class="absolute right-3.5 text-slate-400 pointer-events-none flex items-center">
                  <i data-feather="chevron-down" class="w-4 h-4"></i>
                </div>
              </div>
            </div>

            <!-- Dropdown Keperluan -->
            <div class="space-y-1.5">
              <label for="keperluanSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                Keperluan <span class="text-rose-400">*</span>
              </label>
              <div class="relative flex items-center input-focus-effect rounded-xl">
                <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                  <i data-feather="file-text" class="w-5 h-5"></i>
                </div>
                <select id="keperluanSelect" onchange="toggleKeperluanLainnya()" class="w-full pl-11 pr-8 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer" required>
                  <option value="" disabled selected class="bg-slate-900 text-slate-400">Pilih Keperluan</option>
                  <option value="Mengajar Bimbel" class="bg-slate-900">Mengajar Bimbel</option>
                  <option value="Lainnya" class="bg-slate-900">Lainnya</option>
                </select>
                <div class="absolute right-3.5 text-slate-400 pointer-events-none flex items-center">
                  <i data-feather="chevron-down" class="w-4 h-4"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Textarea Keperluan Lainnya -->
          <div id="wrapper-other-keperluan" class="hidden transition-all duration-300">
            <textarea id="other-keperluan" class="w-full p-3.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all" rows="3" placeholder="Tuliskan rincian keperluan Anda secara lengkap..."></textarea>
          </div>
        </div>

        <!-- KOLOM KANAN: Swafoto & Kamera -->
        <div class="space-y-5">
          <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider border-b border-slate-800 pb-2 flex items-center gap-2">
            <i data-feather="camera" class="w-4 h-4"></i> Konfirmasi Identitas (Live Photo)
          </h2>

          <div class="space-y-2">
            <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-video border-2 border-slate-800 shadow-inner flex items-center justify-center">
              <video id="video" autoplay playsinline class="w-full h-full object-cover mirror transition-opacity duration-300"></video>
              <canvas id="canvas" class="hidden w-full h-full object-cover transition-opacity duration-300"></canvas>
              
              <div id="cameraStatus" class="absolute top-3 left-3 bg-slate-900/80 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10 flex items-center gap-2 shadow-lg">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> Kamera Aktif
              </div>
            </div>

            <!-- Tombol Kamera -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <button type="button" id="btnCapture" onclick="takeSnapshot()" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-3 px-4 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-indigo-600/25">
                <i data-feather="camera" class="w-4 h-4"></i> Ambil Foto
              </button>
              <button type="button" id="btnSwitch" onclick="switchCamera()" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-200 py-3 px-4 rounded-xl text-sm font-semibold transition-all border border-slate-700">
                <i data-feather="refresh-cw" class="w-4 h-4"></i> Ganti Kamera
              </button>
              <button type="button" id="btnRetake" onclick="resetCamera()" class="hidden col-span-2 flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-500 active:scale-[0.98] text-white py-3 px-4 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-amber-600/25">
                <i data-feather="rotate-ccw" class="w-4 h-4"></i> Foto Ulang
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- Tombol Submit (Span Full) -->
      <div class="pt-4 border-t border-slate-800">
        <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 hover:from-blue-500 hover:to-violet-500 active:scale-[0.99] text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-indigo-600/25 transition-all text-base flex items-center justify-center gap-2">
          <i data-feather="send" class="w-5 h-5"></i> Kirim Data Kunjungan
        </button>
      </div>

    </form>
  </div>

  <!-- POP-UP MODAL SUKSES / GAGAL (BESAR TERENTANG DI TENGAH HALAMAN) -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-8 text-center shadow-2xl relative animate-modal">
      
      <!-- Icon Container -->
      <div id="modalIconBg" class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto mb-5 border border-emerald-500/30">
        <i id="modalIcon" data-feather="check-circle" class="w-10 h-10"></i>
      </div>

      <h3 id="modalTitle" class="text-2xl font-extrabold text-white tracking-tight">Kunjungan Terdistribusi!</h3>
      <p id="modalMessage" class="text-slate-300 text-sm sm:text-base mt-2 leading-relaxed">
        Data kunjungan Anda telah berhasil dicatat dalam sistem buku tamu digital kami.
      </p>

      <!-- Tombol Aksi Modal -->
      <div class="mt-8 flex flex-col sm:flex-row gap-3">
        <button type="button" onclick="closeModal(true)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2">
          <i data-feather="check" class="w-5 h-5"></i> Selesai
        </button>
      </div>

    </div>
  </div>

  <script>
    feather.replace();

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwy7PiCBsJHyP4b7tIJjPoHbJMfcl7KwdTrATLmSgBvx8CqevpSg05QkkHeFiu6q67e/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnSwitch = document.getElementById('btnSwitch');
    const btnCapture = document.getElementById('btnCapture');
    const btnRetake = document.getElementById('btnRetake');
    const cameraStatus = document.getElementById('cameraStatus');
    
    let photoData = null;
    let currentStream = null;
    let useFacingMode = "user";

    // Fungsi Modal Dialog Besar di Tengah
    function openModal(title, message, isSuccess = true) {
      const overlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const modalMessage = document.getElementById('modalMessage');
      const modalIconBg = document.getElementById('modalIconBg');
      const modalIcon = document.getElementById('modalIcon');

      modalTitle.textContent = title;
      modalMessage.textContent = message;

      if (isSuccess) {
        modalIconBg.className = "w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto mb-5 border border-emerald-500/30";
        modalIcon.setAttribute('data-feather', 'check-circle');
      } else {
        modalIconBg.className = "w-20 h-20 bg-rose-500/20 text-rose-400 rounded-3xl flex items-center justify-center mx-auto mb-5 border border-rose-500/30";
        modalIcon.setAttribute('data-feather', 'alert-triangle');
      }
      feather.replace();

      overlay.classList.remove('hidden');
    }

    function closeModal(reload = false) {
      document.getElementById('modalOverlay').classList.add('hidden');
      if (reload) location.reload();
    }

    // Pengelolaan Kamera Live
    function startCamera(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      if (facingMode === "user") {
        video.classList.add('mirror');
        canvas.classList.add('mirror');
      } else {
        video.classList.remove('mirror');
        canvas.classList.remove('mirror');
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
        .then(stream => {
          currentStream = stream;
          video.srcObject = stream;
        })
        .catch(err => {
          console.error("Akses kamera ditolak/gagal:", err);
          openModal("Gagal Kamera", "Gagal mengakses kamera. Izinkan akses kamera pada peramban web Anda.", false);
        });
    }

    startCamera(useFacingMode);

    function switchCamera() {
      useFacingMode = (useFacingMode === "user") ? "environment" : "user";
      startCamera(useFacingMode);
    }

    function toggleKeperluanLainnya() {
      const select = document.getElementById('keperluanSelect');
      const wrapper = document.getElementById('wrapper-other-keperluan');
      const otherText = document.getElementById('other-keperluan');
      
      if (select.value === 'Lainnya') {
        wrapper.classList.remove('hidden');
        otherText.required = true;
      } else {
        wrapper.classList.add('hidden');
        otherText.required = false;
        otherText.value = '';
      }
    }

    function takeSnapshot() {
      const context = canvas.getContext('2d');
      const maxWidth = 800;
      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      if (useFacingMode === "user") {
        context.translate(width, 0);
        context.scale(-1, 1);
      }
      
      context.drawImage(video, 0, 0, width, height);
      photoData = canvas.toDataURL('image/jpeg', 0.7);
      
      video.classList.add('hidden');
      canvas.classList.remove('hidden');
      
      btnCapture.classList.add('hidden');
      btnSwitch.classList.add('hidden');
      btnRetake.classList.remove('hidden');

      cameraStatus.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Foto Terkunci`;
    }

    function resetCamera() {
      photoData = null;
      video.classList.remove('hidden');
      canvas.classList.add('hidden');
      
      btnCapture.classList.remove('hidden');
      btnSwitch.classList.remove('hidden');
      btnRetake.classList.add('hidden');

      cameraStatus.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> Kamera Aktif`;
    }

    // Event Pengiriman Formulir
    document.getElementById('guestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!photoData) {
        openModal("Foto Belum Diambil", "Silakan jepret foto swafoto terlebih dahulu sebelum mengirim data.", false);
        return;
      }

      const keperluanSelect = document.getElementById('keperluanSelect').value;
      const keperluanFinal = (keperluanSelect === 'Lainnya') 
        ? document.getElementById('other-keperluan').value 
        : keperluanSelect;

      const payload = {
        nama: document.getElementById('nama').value,
        asal: document.getElementById('asal').value,
        telepon: document.getElementById('telepon').value,
        tujuan: document.getElementById('tujuan').value,
        keperluan: keperluanFinal,
        foto: photoData
      };

      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.innerHTML = `<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Menyimpan Data...`;
      feather.replace();
      submitBtn.disabled = true;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.result === 'success') {
          openModal("Berhasil!", "Data kunjungan Anda telah dicatat ke dalam sistem.", true);
        } else {
          openModal("Terjadi Kesalahan", response.message, false);
          submitBtn.innerHTML = `<i data-feather="send" class="w-5 h-5"></i> Kirim Data Kunjungan`;
          feather.replace();
          submitBtn.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        // Fallback jika respons JSON terhalang tetapi data berhasil dikirim
        openModal("Berhasil!", "Data kunjungan Anda telah dicatat ke dalam sistem.", true);
      });
    });
  </script>
</body>
</html>
